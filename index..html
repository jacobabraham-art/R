<!DOCTYPE html>
<html>
<head>
<title>Messaging App Installer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Messaging App Installer</h1>
<ul id="app-list">
<li>
<span>AwesomeChat</span>
<button class="install-button" data-app="AwesomeChat">Install</button>
</li>
<li>
<span>SuperTalk</span>
<button class="install-button" data-app="SuperTalk">Install</button>
</li>
<li>
<span>MegaMessage</span>
<button class="install-button" data-app="MegaMessage">Install</button>
</li>
</ul>

<div id="progress-bar-container">
<div id="progress-bar"></div>
</div>

<p id="confirmation-message" style="display: none;">Installation complete!</p>
</div>

<script src="script.js"></script>
</body>
</html>
